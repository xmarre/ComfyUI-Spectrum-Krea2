[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-spectrum-krea2"
version = "0.1.0"
description = "Spectrum feature forecasting for native ComfyUI Krea 2 image models"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "xmarre"}]
dependencies = ["torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8", "einops>=0.8", "numpy>=1.26"]
metrics = ["Pillow>=10", "scikit-image>=0.24", "lpips>=0.1.4"]

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-Spectrum-Krea2"

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "ComfyUI-Spectrum-Krea2"
Icon = ""

[tool.setuptools.packages.find]
include = ["comfyui_spectrum_krea2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
