name: Publish Spectrum Krea 2 GitHub release

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - ".github/workflows/github-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read package version
        id: package
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Resolve version-pinned release source
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "${tag}" >/dev/null 2>&1; then
            # Never rebuild or silently replace previously published distributions
            # from a later main commit. A published release must retain its tag.
            source_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            if git rev-parse --verify --quiet "refs/tags/${tag}^{commit}" >/dev/null; then
              echo "::error::Tag ${tag} exists without a release; verify the tag manually before publishing"
              exit 1
            fi
            source_sha="${GITHUB_SHA}"
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "source_sha=${source_sha}" >> "${GITHUB_OUTPUT}"
      - name: Build source archive and wheel for a new version
        if: steps.release.outputs.exists == 'false'
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Build version-pinned ZIP
        env:
          VERSION: ${{ steps.package.outputs.version }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          archive="dist/ComfyUI-Spectrum-Krea2-v${VERSION}.zip"
          git archive --format=zip --prefix="ComfyUI-Spectrum-Krea2-v${VERSION}/" "${SOURCE_SHA}" > "${archive}"
          unzip -tq "${archive}"
      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
          EXISTS: ${{ steps.release.outputs.exists }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          notes="docs/releases/${tag}.md"
          archive="dist/ComfyUI-Spectrum-Krea2-${tag}.zip"
          test -s "${notes}"
          test -s "${archive}"
          if [ "${EXISTS}" = "true" ]; then
            # Promote an existing incorrectly labeled release in place.
            # Preserve its tag and its existing wheel/source distribution.
            gh release edit "${tag}" --title "Spectrum Krea 2 ${tag}" --notes-file "${notes}" --draft=false --prerelease=false --latest
            if ! gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fxq "$(basename "${archive}")"; then
              gh release upload "${tag}" "${archive}"
            fi
          else
            gh release create "${tag}" dist/*.whl dist/*.tar.gz "${archive}" --target "${GITHUB_SHA}" --title "Spectrum Krea 2 ${tag}" --notes-file "${notes}" --latest
          fi
      - name: Verify published release and ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          test "$(gh release view "${tag}" --json isDraft --jq '.isDraft')" = "false"
          test "$(gh release view "${tag}" --json isPrerelease --jq '.isPrerelease')" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "${tag}"
          gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fx "ComfyUI-Spectrum-Krea2-${tag}.zip"
          gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fx "comfyui_spectrum_krea2-${VERSION}-py3-none-any.whl"
          gh release view "${tag}" --json assets --jq '.assets[].name' | grep -Fx "comfyui_spectrum_krea2-${VERSION}.tar.gz"
