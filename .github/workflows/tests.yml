name: CPU contracts and packaging
on:
  pull_request:
  push:
    branches: [main, feature/native-krea2-spectrum]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' build
      - name: Check out audited native components
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 7ad7adb38f6cbb6c2b0713d3bd44c3fb2b9c8ebe
          path: _comfy
      - name: Run CPU numerical and native-component tests
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/_comfy
        run: python -m pytest -q
      - name: Check import, CLI and packaging
        run: |
          python -m compileall -q comfyui_spectrum_krea2 tools
          python tools/benchmark.py --help
          python -m build
