name: CPU contracts and packaging
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
        sampler: ['current']
        include:
          - python: '3.12'
            sampler: 'legacy'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU PyTorch and test dependencies
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' build
      - name: Check out audited native components
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 7ad7adb38f6cbb6c2b0713d3bd44c3fb2b9c8ebe
          path: _comfy
      - name: Check out earlier native sampler container
        if: matrix.sampler == 'legacy'
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 135abed8da169e33ab0b86550e05e3ae55d6df8c
          path: _sampler_legacy
      - name: Run CPU numerical and native-component tests
        env:
          COMFYUI_ROOT: ${{ github.workspace }}/_comfy
          COMFYUI_SAMPLER_ROOT: ${{ github.workspace }}/${{ matrix.sampler == 'legacy' && '_sampler_legacy' || '_comfy' }}
        run: |
          python tools/audit_contracts.py --comfy-root _comfy
          python -m pytest -q
      - name: Check import, CLI and packaging
        run: |
          python -m compileall -q comfyui_spectrum_krea2 tools
          python tools/benchmark.py --help
          python -m build

  full-native-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 7ad7adb38f6cbb6c2b0713d3bd44c3fb2b9c8ebe
          path: _comfy
      - uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: 135abed8da169e33ab0b86550e05e3ae55d6df8c
          path: _sampler_legacy
      - name: Check out Sol-Krea2 companion patch
        uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-Sol-H3
          ref: d59355dc7101b7f29e7bd7e6768badcd4f2d08c9
          path: _sol_h3
      - name: Check out Krea 2 Diff-Aid companion patch
        uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-DiffAid-Patches
          ref: 28c9d0029390513ce8f54b98ede60d16fbe3a29f
          path: _diffaid
      - name: Check out audited KJNodes preview wrapper
        uses: actions/checkout@v4
        with:
          repository: kijai/ComfyUI-KJNodes
          ref: ab72eda7ffad6280422d71ab7d54d3fb87c0ba18
          path: _kj
      - name: Check out October KJNodes preview revision
        uses: actions/checkout@v4
        with:
          repository: kijai/ComfyUI-KJNodes
          ref: daa2bee6951527ed5600fa0c7263a1154ffbf630
          path: _kj_oct
      - name: Check out September KJNodes preview revision
        uses: actions/checkout@v4
        with:
          repository: kijai/ComfyUI-KJNodes
          ref: bd5c84e57e94e26599e3c3433a6692f50c5c671e
          path: _kj_sep
      - name: Install full native CPU integration dependencies
        run: |
          python -m pip install torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[test]' torchsde==0.2.6 scipy safetensors Pillow tqdm psutil pyyaml sentencepiece transformers==5.22.1 requests comfy-kitchen==0.2.40 comfy-aimdo==0.6.0
      - name: Exercise full native ModelPatcher and CFG sampling
        run: |
          python tests/full_comfy_smoke.py --comfy-root _comfy --sol-root _sol_h3 --diffaid-root _diffaid --kj-root _kj --kj-legacy-root _kj_oct --kj-older-root _kj_sep
          python tests/full_comfy_smoke.py --comfy-root _comfy --sampler-source-root _sampler_legacy --sol-root _sol_h3 --diffaid-root _diffaid --kj-root _kj --kj-legacy-root _kj_oct --kj-older-root _kj_sep
